[project]
name = "toss-auto"
version = "0.1.0"
description = "토스증권 월간 자동 투자"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "sqlalchemy>=2.0",
  "pydantic-settings>=2.6",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.pytest.ini_options]
pythonpath = ["."]
