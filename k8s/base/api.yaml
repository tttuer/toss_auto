apiVersion: v1
kind: Service
metadata:
  name: toss-auto-api
spec:
  selector: { app: toss-auto-api }
  ports:
    - port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: toss-auto-api
spec:
  replicas: 1
  selector:
    matchLabels: { app: toss-auto-api }
  template:
    metadata:
      labels: { app: toss-auto-api }
    spec:
      imagePullSecrets:
        - name: toss-auto-registry
      containers:
        - name: api
          image: toss-auto-api:latest
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - secretRef: { name: toss-auto-secrets }
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 3
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 256Mi }
