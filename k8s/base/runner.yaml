apiVersion: batch/v1
kind: CronJob
metadata:
  name: toss-auto-runner
spec:
  schedule: "*/10 * * * *"
  timeZone: Asia/Seoul
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1100
  failedJobsHistoryLimit: 100
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 604800
      template:
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: toss-auto-registry
          containers:
            - name: runner
              image: toss-auto-api:latest
              command: ["python", "-m", "app.runner"]
              envFrom:
                - secretRef: { name: toss-auto-secrets }
